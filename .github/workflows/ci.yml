name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Upstream examples are kept identical to master and are not linted here.
      - name: Lint
        run: >-
          yarn workspaces foreach -A
          --exclude agentic-call-control
          --exclude @3cx-examples/openai-realtime
          --exclude @3cx-examples/gemini-realtime
          --exclude @3cx-examples/xai-realtime
          --exclude @3cx-examples/alibaba-qwen-realtime
          run lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn workspaces foreach -A run test
